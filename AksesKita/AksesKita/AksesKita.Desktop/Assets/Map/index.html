<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>AksesKita Map — Surabaya</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; }
        .leaflet-popup-content-wrapper { border-radius: 14px; padding: 0; overflow: hidden; border: 1px solid #CBD5E1; box-shadow: 0 10px 25px -5px rgba(15,23,42,.18); }
        .leaflet-popup-content { margin: 0; width: 270px !important; }
        .pop .hd { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; font-size: 11.5px; font-weight: 700; border-bottom: 1px solid rgba(15,23,42,.08); }
        .pop .hd i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
        .pop .hd span.tk { color: #475569; font-weight: 600; }
        .pop .bd { padding: 12px 14px 14px; }
        .pop .tt { font-size: 14px; font-weight: 700; color: #0F172A; margin: 0 0 4px; line-height: 1.3; }
        .pop .ad { font-size: 12px; color: #475569; margin-bottom: 8px; }
        .pop .meta { font-size: 12px; color: #475569; margin-bottom: 12px; }
        .pop button { width: 100%; border: 0; border-radius: 10px; padding: 9px 10px; font-weight: 700; cursor: pointer; font-size: 12.5px; font-family: inherit; }
        .pop button:focus-visible { outline: 3px solid #0E7490; outline-offset: 2px; }
        .pop .primary { background: #0F2A43; color: #fff; margin-bottom: 6px; }
        .pop .primary:hover { background: #17395C; }
        .pop .ghost { background: #fff; color: #0F172A; border: 1px solid #E2E8F0; }
        .pop .ghost:hover { background: #F8FAFC; }
        .legend { background: rgba(255,255,255,.96); padding: 12px 16px; border-radius: 14px; border: 1px solid #E2E8F0; box-shadow: 0 4px 12px rgba(15,23,42,.12); font-size: 12.5px; line-height: 1.9; color: #334155; }
        .legend b { display: block; font-size: 11px; letter-spacing: .06em; color: #475569; margin-bottom: 4px; }
        .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
        .badge { position: absolute; z-index: 1000; top: 12px; left: 56px; background: rgba(255,255,255,.96); border: 1px solid #E2E8F0; border-radius: 22px; padding: 8px 16px; font-size: 13px; font-weight: 600; color: #0F172A; box-shadow: 0 2px 8px rgba(15,23,42,.12); }
        .badge i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #DC2626; margin-right: 8px; }
        .leaflet-bar a { width: 32px; height: 32px; line-height: 32px; color: #334155; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="badge"><i></i>Mode Live GIS: Surabaya &amp; Sekitarnya</div>
    <script>
        // Centre of Surabaya.
        var map = L.map('map').setView([-7.2575, 112.7521], 12);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        var layer = L.layerGroup().addTo(map);
        var markers = {};

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function dot(color) {
            return L.divIcon({
                className: '',
                html: '<div style="width:18px;height:18px;border-radius:50%;background:' + color +
                      ';border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)"></div>',
                iconSize: [18, 18], iconAnchor: [9, 9], popupAnchor: [0, -10]
            });
        }

        function post(type, id) {
            if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(type + ':' + id);
        }

        // Warna kepala popup mengikuti warna penanda (sama dengan legenda).
        var headTint = { '#DC2626': ['#FEF2F2', '#B91C1C'], '#D97706': ['#FFFBEB', '#B45309'],
                         '#0E7490': ['#ECFEFF', '#0E7490'], '#16A34A': ['#F0FDF4', '#15803D'] };
        var headLabel = { '#DC2626': 'Kritis / Mendesak', '#D97706': 'Menunggu Tinjauan',
                          '#0E7490': 'Sedang Perbaikan', '#16A34A': 'Telah Diperbaiki' };

        function popup(p) {
            var t = headTint[p.color] || ['#F8FAFC', '#334155'];
            return '<div class="pop">' +
                '<div class="hd" style="background:' + t[0] + ';color:' + t[1] + '">' +
                '<span><i style="background:' + p.color + '"></i>' + esc(headLabel[p.color] || p.status) + '</span>' +
                '<span class="tk">' + esc(p.ticket) + '</span></div>' +
                '<div class="bd">' +
                '<div class="tt">' + esc(p.title) + '</div>' +
                '<div class="ad">' + esc(p.address) + '</div>' +
                '<div class="meta">' + esc(p.category) + ' · Tingkat <b>' + esc(p.severity) + '</b> · ' +
                esc(p.support) + ' dukungan</div>' +
                '<button class="primary" onclick="post(\'open\',' + p.id + ')">Buka Detail &rarr;</button>' +
                '<button class="ghost" onclick="post(\'nav\',' + p.id + ')">Navigasi Rute Ramah Difabel</button>' +
                '</div></div>';
        }

        // Called from the WPF host with the filtered reports.
        function setPoints(arr) {
            layer.clearLayers();
            markers = {};
            arr.forEach(function (p) {
                var m = L.marker([p.lat, p.lng], { icon: dot(p.color) }).bindPopup(popup(p), { minWidth: 270, maxWidth: 270 });
                m.addTo(layer);
                markers[p.id] = m;
            });
        }

        // Called from the WPF host when a report is picked in the sidebar.
        function focusPoint(id) {
            var m = markers[id];
            if (!m) return;
            map.flyTo(m.getLatLng(), 16, { duration: 0.8 });
            setTimeout(function () { m.openPopup(); }, 850);
        }

        var legend = L.control({ position: 'bottomright' });
        legend.onAdd = function () {
            var d = L.DomUtil.create('div', 'legend');
            d.innerHTML = '<b>LEGENDA PETA AKSESIBILITAS</b>' +
                '<i style="background:#DC2626"></i>Kritis / Bahaya<br>' +
                '<i style="background:#D97706"></i>Menunggu Tinjauan<br>' +
                '<i style="background:#0E7490"></i>Sedang Perbaikan<br>' +
                '<i style="background:#16A34A"></i>Telah Diperbaiki';
            return d;
        };
        legend.addTo(map);
    </script>
</body>
</html>
