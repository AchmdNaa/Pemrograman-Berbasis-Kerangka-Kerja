<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>AksesKita Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([-6.2088, 106.8456], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var markerLayer = L.layerGroup().addTo(map);

        // Mengubah teks agar aman ditampilkan di popup
        function esc(text) {
            var d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        // Dipanggil dari C# (MapView.xaml.cs) dengan data laporan dari database
        function setMarkers(items) {
            markerLayer.clearLayers();
            var bounds = [];
            items.forEach(function (r) {
                var m = L.marker([r.latitude, r.longitude]).addTo(markerLayer);
                m.bindPopup('<b>' + esc(r.title) + '</b><br>' + esc(r.code) +
                            '<br>' + esc(r.category) +
                            '<br>Status: ' + esc(r.status) +
                            ' &middot; Tingkat: ' + esc(r.severity));
                bounds.push([r.latitude, r.longitude]);
            });
            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
            }
        }
    </script>
</body>
</html>
